
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="./style.css">

    <style>

        /* CART PAGE */

        #cart-parent {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        #cart-parent h1 {
            margin-bottom: 25px;
        }

        .cart-product {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
        }

        .cart-product img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
        }

        .cart-info {
            flex: 1;
            min-width: 150px;
        }

        .cart-info h3 {
            margin-bottom: 10px;
        }

        .cart-info p {
            margin: 6px 0;
            color: #555;
        }

        .cart-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-buttons button {
            padding: 9px 13px;
            border: none;
            border-radius: 7px;
            background: #fdbc23;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-buttons button:hover {
            background: #e5a510;
        }

        .remove-btn {
            background: #e53935 !important;
            color: white;
        }

        #cart-total {
            text-align: right;
            margin-top: 25px;
        }

        #cart-total h2 {
            margin-bottom: 15px;
        }

        #cart-total button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #0c5ee2;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        #empty-cart {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        #empty-cart a {
            color: #0c5ee2;
        }

        #continue-shopping {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #0c5ee2;
            font-weight: bold;
        }

        @media(max-width:600px) {

            .cart-product {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-product img {
                width: 100%;
                height: 200px;
            }

            #cart-total {
                text-align: left;
            }

        }

    </style>

</head>

<body>

    <div id="cart-parent">

        <h1>Shopping Cart</h1>

        <div id="cart-items"></div>

        <div id="cart-total">

            <h2>
                Total Amount: ₹<span id="total">0</span>
            </h2>

            <button onclick="checkout()">
                Checkout
            </button>

            <button onclick="clearCart()">
                Clear Cart
            </button>

            <br>

            <a href="./index.html" id="continue-shopping">
                Continue Shopping
            </a>

        </div>

    </div>

    <script>

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        // DISPLAY CART

        function displayCart() {

            let cartItems = document.getElementById("cart-items");

            let total = 0;

            cartItems.innerHTML = "";

            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div id="empty-cart">
                        <h2>Your Cart Is Empty!</h2>
                        <p>Add some flowers to your cart.</p>
                        <a href="./index.html">Continue Shopping</a>
                    </div>
                `;

                document.getElementById("total").innerText = 0;

                return;
            }

            cart.forEach((item, index) => {

                let subtotal = item.price * item.quantity;

                total += subtotal;

                cartItems.innerHTML += `

                    <div class="cart-product">

                        <img src="${item.image}" alt="${item.name}">

                        <div class="cart-info">

                            <h3>${item.name}</h3>

                            <p>Price: ₹${item.price}</p>

                            <p>Quantity: ${item.quantity}</p>

                            <p>Subtotal: ₹${subtotal}</p>

                        </div>

                        <div class="cart-buttons">

                            <button onclick="changeQuantity(${index}, -1)">-</button>

                            <button onclick="changeQuantity(${index}, 1)">+</button>

                            <button class="remove-btn"
                                onclick="removeProduct(${index})">
                                Remove
                            </button>

                        </div>

                    </div>

                `;

            });

            document.getElementById("total").innerText = total;

        }

        // SAVE CART

        function saveCart() {

            localStorage.setItem("cart", JSON.stringify(cart));

        }

        // CHANGE QUANTITY

        function changeQuantity(index, value) {

            cart[index].quantity += value;

            if (cart[index].quantity <= 0) {

                cart.splice(index, 1);

            }

            saveCart();

            displayCart();

        }

        // REMOVE PRODUCT

        function removeProduct(index) {

            cart.splice(index, 1);

            saveCart();

            displayCart();

        }

        // CLEAR CART

        function clearCart() {

            cart = [];

            saveCart();

            displayCart();

        }

        // CHECKOUT

        function checkout() {

            if (cart.length === 0) {

                alert("Your Cart Is Empty!");

                return;

            }

            let total = document.getElementById("total").innerText;

            alert("Order Placed Successfully!\nTotal Amount: ₹" + total);

            cart = [];

            saveCart();

            displayCart();

        }

        displayCart();

    </script>

</body>

</html>
